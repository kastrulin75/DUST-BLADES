<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DUST & BLADES | Вход</title>
    <script>
        /* UI scale like on 1080p: 1 on <=1080p, ~1.33 on 2K, 2 on 4K */
        (function () {
            function fit() {
                var s = Math.max(1, Math.min(innerWidth / 1920, innerHeight / 1080));
                document.documentElement.style.setProperty('--s', s.toFixed(4));
            }
            fit();
            addEventListener('resize', fit);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Tiny5&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/theme.css?v=4.0">
    <link rel="stylesheet" href="style.css?v=4.0">
    <link rel="shortcut icon" href="../media/images/icon.ico" type="image/x-icon">
</head>
<body>
<div id="fxCurtain"></div>

<main class="gate">
    <div class="logo-wrap">
        <div class="logo-glow"></div>
        <img src="../media/images/logo.png" alt="DUST & BLADES" class="logo" onerror="this.style.display='none'">
    </div>

    <section class="px-panel glass auth">
        <div class="tabs" role="tablist">
            <button class="tab active" data-tab="login" role="tab" type="button">ВОЙТИ</button>
            <button class="tab" data-tab="register" role="tab" type="button">РЕГИСТРАЦИЯ</button>
            <i class="tab-marker"></i>
        </div>

        <form class="tab-content active" id="loginTab" autocomplete="off" novalidate>
            <div class="px-field">
                <label for="loginUsername">ИМЯ</label>
                <input class="px-input" type="text" id="loginUsername" placeholder="ИМЯ" maxlength="20" spellcheck="false">
            </div>
            <div class="px-field">
                <label for="loginPassword">ПАРОЛЬ</label>
                <input class="px-input" type="password" id="loginPassword" placeholder="••••">
            </div>
            <button class="px-btn red submit" id="doLogin" type="submit">
                <img src="../media/icons/attack.png" class="ico" alt="">
                ВОЙТИ
            </button>
            <div id="loginError" class="px-error" hidden></div>
        </form>

        <form class="tab-content" id="registerTab" autocomplete="off" novalidate>
            <div class="px-field">
                <label for="regUsername">ИМЯ</label>
                <input class="px-input" type="text" id="regUsername" placeholder="ИМЯ" maxlength="20" spellcheck="false">
            </div>
            <div class="px-field">
                <label for="regPassword">ПАРОЛЬ</label>
                <input class="px-input" type="password" id="regPassword" placeholder="••••">
            </div>
            <div class="px-field">
                <label for="regPassword2">ПОВТОРИТЕ ПАРОЛЬ</label>
                <input class="px-input" type="password" id="regPassword2" placeholder="••••">
            </div>
            <button class="px-btn red submit" id="doRegister" type="submit">
                <img src="../media/icons/skull.png" class="ico" alt="">
                СОЗДАТЬ
            </button>
            <div id="regError" class="px-error" hidden></div>
        </form>
    </section>

</main>

<div class="crt"></div>

<script src="../shared/core.js?v=4.0"></script>
<script src="../shared/fx.js?v=4.0"></script>
<script src="script.js?v=4.0"></script>
</body>
</html>
